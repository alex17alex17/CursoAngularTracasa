<section class="form-page" aria-labelledby="page-title">
  <div class="page-heading">
    <p class="eyebrow">Gestión documental</p>
    <h1 id="page-title">Editar expediente</h1>
    <p class="intro">Actualiza los datos del expediente seleccionado.</p>
  </div>

  <form class="expediente-form" #formulario="ngForm" (ngSubmit)="guardarExpediente(formulario)">
    <div class="form-columns">
      <div class="form-column">
        <label class="field">
          <span>Número</span>
          <input type="text" name="numero" [ngModel]="expediente()?.numero ?? ''" readonly />
        </label>

        <label class="field">
          <span>Estado</span>
          <select name="estado" [ngModel]="expediente()?.estado ?? ''" required>
            <option value="abierto">Abierto</option>
            <option value="en_proceso">En proceso</option>
            <option value="cerrado">Cerrado</option>
          </select>
        </label>

        <label class="field">
          <span>Fecha alta</span>
          <input
            type="date"
            name="fechaAlta"
            [ngModel]="fechaComoTexto(expediente()?.fechaAlta)"
            required
          />
        </label>

        <label class="field">
          <span>Solicitante</span>
          <input
            type="text"
            name="solicitante"
            [ngModel]="expediente()?.solicitante ?? ''"
            required
          />
        </label>
      </div>

      <div class="form-column">
        <label class="field">
          <span>Título</span>
          <input type="text" name="titulo" [ngModel]="expediente()?.titulo ?? ''" required />
        </label>

        <label class="field">
          <span>Prioridad</span>
          <select name="prioridad" [ngModel]="expediente()?.prioridad ?? ''" required>
            <option value="alta">Alta</option>
            <option value="media">Media</option>
            <option value="baja">Baja</option>
          </select>
        </label>

        <label class="field">
          <span>Fecha vencimiento</span>
          <input
            type="date"
            name="fechaVencimiento"
            [ngModel]="fechaComoTexto(expediente()?.fechaVencimiento)"
            required
          />
        </label>

        <label class="field">
          <span>Unidad</span>
          <input type="text" name="unidad" [ngModel]="expediente()?.unidad ?? ''" required />
        </label>
      </div>
    </div>

    <label class="field description-field">
      <span>Descripción</span>
      <textarea
        name="descripcion"
        rows="5"
        [ngModel]="expediente()?.descripcion ?? ''"
        required
      ></textarea>
    </label>

    <div class="form-actions">
      <button class="delete-button" type="button" (click)="eliminarExpediente()">
        Eliminar expediente
      </button>
      <div class="right-actions">
        <button class="cancel-button" type="button" (click)="cancelar()">Cancelar</button>
        <button class="save-button" type="submit">Guardar</button>
      </div>
    </div>
  </form>
</section>
