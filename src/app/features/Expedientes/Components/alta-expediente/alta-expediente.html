<section class="form-page" aria-labelledby="page-title">
  <div class="page-heading">
    <p class="eyebrow">Gestión documental</p>
    <h1 id="page-title">Nuevo expediente</h1>
    <p class="intro">Completa los datos para registrar un nuevo expediente.</p>
  </div>

  <form class="expediente-form" [formRoot]="altaForm">
    <div class="form-columns">
      <div class="form-column">
        <label class="field">
          <span>Número</span>
          <input type="text" placeholder="EXP-Año-Número" [formField]="altaForm.numero" />
          @if (altaForm.numero().invalid() && altaForm.numero().touched()) {
            <span class="field-error" role="alert">
              @for (error of altaForm.numero().errors(); track error) {
                {{ error.message }}
              }
            </span>
          }
        </label>

        <label class="field">
          <span>Estado</span>
          <select [formField]="altaForm.estado">
            <option value="">Selecciona un estado</option>
            <option value="abierto">Abierto</option>
            <option value="en_proceso">En proceso</option>
            <option value="cerrado">Cerrado</option>
          </select>
          @if (altaForm.estado().invalid() && altaForm.estado().touched()) {
            <span class="field-error" role="alert">
              @for (error of altaForm.estado().errors(); track error) {
                {{ error.message }}
              }
            </span>
          }
        </label>

        <label class="field">
          <span>Fecha alta</span>
          <input type="date" [formField]="altaForm.fechaAlta" />
          @if (altaForm.fechaAlta().invalid() && altaForm.fechaAlta().touched()) {
            <span class="field-error" role="alert">
              @for (error of altaForm.fechaAlta().errors(); track error) {
                {{ error.message }}
              }
            </span>
          }
        </label>

        <label class="field">
          <span>Solicitante</span>
          <select [formField]="altaForm.solicitante">
            <option value="">Selecciona un solicitante</option>
            <option>Área de Urbanismo</option>
            <option>María García López</option>
            <option>Asociación Cultural Centro</option>
            <option>Javier Martín Ruiz</option>
          </select>
          @if (altaForm.solicitante().invalid() && altaForm.solicitante().touched()) {
            <span class="field-error" role="alert">
              @for (error of altaForm.solicitante().errors(); track error) {
                {{ error.message }}
              }
            </span>
          }
        </label>
      </div>

      <div class="form-column">
        <label class="field">
          <span>Título</span>
          <input type="text" placeholder="Título del expediente" [formField]="altaForm.titulo" />
          @if (altaForm.titulo().invalid() && altaForm.titulo().touched()) {
            <span class="field-error" role="alert">
              @for (error of altaForm.titulo().errors(); track error) {
                {{ error.message }}
              }
            </span>
          }
        </label>

        <label class="field">
          <span>Prioridad</span>
          <select [formField]="altaForm.prioridad">
            <option value="">Selecciona una prioridad</option>
            <option value="alta">Alta</option>
            <option value="media">Media</option>
            <option value="baja">Baja</option>
          </select>
          @if (altaForm.prioridad().invalid() && altaForm.prioridad().touched()) {
            <span class="field-error" role="alert">
              @for (error of altaForm.prioridad().errors(); track error) {
                {{ error.message }}
              }
            </span>
          }
        </label>

        <label class="field">
          <span>Fecha de vencimiento</span>
          <input type="date" [formField]="altaForm.fechaVencimiento" />
          @if (altaForm.fechaVencimiento().invalid() && altaForm.fechaVencimiento().touched()) {
            <span class="field-error" role="alert">
              @for (error of altaForm.fechaVencimiento().errors(); track error) {
                {{ error.message }}
              }
            </span>
          }
        </label>

        <label class="field">
          <span>Unidad</span>
          <input type="text" placeholder="Unidad responsable" [formField]="altaForm.unidad" />
          @if (altaForm.unidad().invalid() && altaForm.unidad().touched()) {
            <span class="field-error" role="alert">
              @for (error of altaForm.unidad().errors(); track error) {
                {{ error.message }}
              }
            </span>
          }
        </label>
      </div>
    </div>

    <label class="field description-field">
      <span>Descripción</span>
      <textarea
        rows="5"
        placeholder="Añade una descripción del expediente"
        [formField]="altaForm.descripcion"
      ></textarea>
    </label>

    <div class="form-actions">
      <button class="cancel-button" type="button" (click)="cancelar()">Cancelar</button>
      <button class="create-button" type="submit" [disabled]="!altaForm().valid()">Crear</button>
    </div>
  </form>
</section>
