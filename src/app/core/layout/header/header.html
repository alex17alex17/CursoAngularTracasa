<mat-toolbar color="primary" class="header-toolbar">
  <span class="brand-name">Expediente - MVP</span>
  <span class="toolbar-spacer"></span>

  @if (autenticado()) {
    <div class="logout-panel">
      <span class="user-label">USER - {{ nombreUsuarioAutenticado() }}</span>
      <button matButton="filled" type="button" class="logout-button" (click)="logout.emit()">
        Salir
      </button>
    </div>
  }
</mat-toolbar>
