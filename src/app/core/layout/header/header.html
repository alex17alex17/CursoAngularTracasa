<mat-toolbar color="primary" class="header-toolbar">
  <span class="brand-name">Expediente - MVP</span>
  <span class="toolbar-spacer"></span>

  @if (autenticado()) {
    <div class="logout-panel">
      <div class="user-profile">
        <span class="user-avatar" aria-hidden="true">{{
          (nombreUsuarioAutenticado() ?? '?').charAt(0).toUpperCase()
        }}</span>
        <span class="user-details">
          <span class="user-label">Usuario</span>
          <span class="user-name">{{ nombreUsuarioAutenticado() }}</span>
        </span>
      </div>
      <button matButton="filled" type="button" class="logout-button" (click)="logout.emit()">
        Salir
      </button>
    </div>
  }
</mat-toolbar>
